name: Bug report
description: Anything else that misbehaves.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version + browser
      placeholder: "0.5.1, Firefox 142"
    validations:
      required: true
